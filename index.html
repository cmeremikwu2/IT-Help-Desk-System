<!DOCTYPE html>
<html>
<head>
        <title>IT Help Desk</title>
        <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>IT Help Desk Ticket System</h1>

    <h2>Submit a Ticket</h2>

    <label>Name:</label>
    <input type="text" id="name">
    <br><br>

    <label>Problem:</label>
    <input type="text" id="problem">
    <br><br>

    <label>Description:</label>
    <textarea id="description"></textarea>
    <br><br>

    <label>Priority:</label>
    <select id="priority">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
    </select>
    <br><br>

    <button onclick="submitTicket()">Submit Ticket</button>

    <h2>Tickets</h2>

    <div id="tickets"></div>

    <script>
        let ticketNumber = 1;
    
        function submitTicket() {
    
            let name = document.getElementById("name").value;
            let problem = document.getElementById("problem").value;
            let description = document.getElementById("description").value;
            let priority = document.getElementById("priority").value;
    
            if (name === "" || problem === "" || description === "") {
                alert("Please fill out all fields.");
                return;
            }
    
            let ticket = `
                <div class="ticket">
                    <h3>Ticket #${ticketNumber}</h3>
    
                    <p><strong>Name:</strong> ${name}</p>
    
                    <p><strong>Problem:</strong> ${problem}</p>
    
                    <p><strong>Description:</strong> ${description}</p>
    
                    <p><strong>Priority:</strong> ${priority}</p>
    
                    <p class="status">
                        Status: <span id="status${ticketNumber}">Open</span>
                    </p>
    
                    <button onclick="updateStatus(${ticketNumber}, 'In Progress')">
                        Start Working
                    </button>
    
                    <button onclick="updateStatus(${ticketNumber}, 'Resolved')">
                        Resolve
                    </button>
                </div>
            `;
    
            document.getElementById("tickets").innerHTML += ticket;
    
            ticketNumber++;
    
            document.getElementById("name").value = "";
            document.getElementById("problem").value = "";
            document.getElementById("description").value = "";
        }
    
        function updateStatus(number, newStatus) {
    
            document.getElementById("status" + number).textContent = newStatus;
    
        }
    </script>

</body>
</html>
